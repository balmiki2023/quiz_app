name: Keep Supabase Alive

on:
  schedule:
    # Runs at 00:00 UTC every Tuesday and Friday (Every 3 days)
    - cron: '0 0 * * 2,5'
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  ping_db:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase Database REST API
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
