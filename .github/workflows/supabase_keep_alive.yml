name: Keep Supabase Alive & Check Sizes

on:
  schedule:
    - cron: '0 0 * * 2,5' # Runs at 00:00 UTC every Tuesday and Friday
  workflow_dispatch: # Allows you to trigger it manually from the GitHub UI

jobs:
  ping_and_check_size:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Table Sizes from Supabase
        run: |
          curl -i -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_table_sizes" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json"
